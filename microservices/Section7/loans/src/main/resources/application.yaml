spring:
  application:
    name: "loans"
  profiles:
    active: default

  datasource:
    url: jdbc:mysql://localhost:3308/loansdb
    username: root
    password: root
    sql:
      init:
        mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

  config:
    import: "optional:configserver:http://localhost:8071/"

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: "*"
