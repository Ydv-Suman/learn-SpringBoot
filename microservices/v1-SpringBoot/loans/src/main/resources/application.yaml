spring:
  application:
    name: loans

  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  config:
    import:
      - "application_qa.yml"
      - "application_prod.yml"
  profiles:
    active:
      - "prod"

server:
  port: 8090

build:
  version: "3.0"

loans:
  message: "Welcome to Loans related local api"
  contactDetails:
    name: "David - Developer"
    email: "david@simplebank.com"
  onCallSupport:
    - (111) 111 1111
    - (222) 222 2222
